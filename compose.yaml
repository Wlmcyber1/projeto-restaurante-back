services:
  postgres:
    image: postgres:18
    container_name: projetokotlin-db
    environment:
      POSTGRES_DB: projetokotlin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 no PC -> 5432 dentro do container (a 5432 do PC é usada pelo db-biblioteca)
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
