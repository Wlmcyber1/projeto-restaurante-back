spring.application.name=ProjetoKotlin

# 8081 porque a 8080 é usada pelo projeto da Biblioteca
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/projetokotlin
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Roda o data.sql (cardápio inicial) depois que o Hibernate cria as tabelas
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
